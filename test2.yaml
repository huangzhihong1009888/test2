apiVersion: apps/v1
kind: Deployment

metadata:
  name: test2

spec:
  replicas: 2

  selector:
    matchLabels:
      app: test2

  template:
    metadata:
      labels:
        app: test2

    spec:
      containers:
        - name: test2
          image: test2:v2
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8082

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev